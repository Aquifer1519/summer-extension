<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      width: 360px;
      padding: 16px;
      color: #222;
      margin: 0;
    }
    h1 { font-size: 15px; margin: 0 0 10px 0; }
    textarea {
      width: 100%;
      height: 90px;
      font-size: 13px;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      resize: vertical;
    }
    button {
      margin-top: 8px;
      padding: 7px 14px;
      font-size: 13px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: #222;
      color: white;
      width: 100%;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    .panel {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      background: #f5f5f5;
      display: none;
    }
    .panel h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #888;
      margin: 0 0 6px 0;
    }
    .bar-track {
      position: relative;
      height: 18px;
      border-radius: 9px;
      margin: 8px 0;
    }
    #sentiment-track {
      background: linear-gradient(to right, #d32f2f, #eee 50%, #2e7d32);
    }
    #ai-track {
      background: linear-gradient(to right, #2e7d32, #eee 50%, #d32f2f);
    }
    .bar-marker {
      position: absolute;
      top: -3px;
      width: 3px;
      height: 24px;
      background: #222;
      border-radius: 2px;
      transform: translateX(-1.5px);
    }
    .label { font-size: 14px; font-weight: 600; }
    .score { color: #555; font-size: 11px; word-break: break-word; }
    .error { color: #d32f2f; }
    .status { font-size: 11px; color: #999; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Text Analysis Tester</h1>
  <textarea id="text" placeholder="Type, paste, or select text on the page first..."></textarea>
  <button id="analyze-btn">Analyze</button>
  <div class="status" id="status"></div>

  <div id="sentiment-panel" class="panel">
    <h2>Sentiment</h2>
    <div id="sentiment-label" class="label"></div>
    <div id="sentiment-score" class="score"></div>
    <div id="sentiment-track" class="bar-track"><div id="sentiment-marker" class="bar-marker"></div></div>
  </div>

  <div id="ai-panel" class="panel">
    <h2>AI Likelihood</h2>
    <div id="ai-label" class="label"></div>
    <div id="ai-score" class="score"></div>
    <div id="ai-track" class="bar-track"><div id="ai-marker" class="bar-marker"></div></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
